<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
{% block head %}{% endblock %}
<title>{% block titulo %}Reporte Móvil{% endblock %}</title>
<style>
  :root{--fondo:#f1f5f9;--tarjeta:#fff;--borde:#e2e8f0;--texto:#1e293b;--gris:#64748b;
        --azul:#1e3a8a;--ok:#16a34a;--ok-bg:#dcfce7;--falta:#dc2626;--falta-bg:#fee2e2;
        --sobra:#b45309;--sobra-bg:#fef3c7}
  @media (prefers-color-scheme:dark){:root{--fondo:#0f172a;--tarjeta:#1e293b;--borde:#334155;
        --texto:#e2e8f0;--gris:#94a3b8;--azul:#93c5fd;--ok:#4ade80;--ok-bg:#14532d;
        --falta:#f87171;--falta-bg:#450a0a;--sobra:#fbbf24;--sobra-bg:#422006}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--fondo);color:var(--texto);
       font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;
         padding:12px 16px;background:#1e3a8a;color:#fff}
  header a{color:#fff;text-decoration:none}
  header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:12px 16px 32px;max-width:720px;margin:0 auto}
  .tarjeta{display:block;background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;
           padding:12px 14px;margin-bottom:10px;color:inherit;text-decoration:none}
  .fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sub{color:var(--gris);font-size:13px}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
  .ok{color:var(--ok);background:var(--ok-bg)}
  .falta{color:var(--falta);background:var(--falta-bg)}
  .sobra{color:var(--sobra);background:var(--sobra-bg)}
  .activo{border:2px solid var(--ok)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
  .aviso{padding:12px 14px;border-radius:10px;margin-bottom:12px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris);margin:18px 0 8px}
  input,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--borde);
               background:var(--tarjeta);color:var(--texto)}
  button{background:#2563eb;color:#fff;border:0;font-weight:600;margin-top:10px}
  .resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .resumen div{background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;
               padding:8px;text-align:center}
  .resumen b{display:block;font-size:22px}
  label{display:block;font-weight:600;margin:10px 0 4px}
  .boton{display:block;text-align:center;background:#2563eb;color:#fff;padding:12px;border-radius:10px;
         text-decoration:none;font-weight:600;margin-bottom:12px}
  .secundario{background:transparent;color:var(--gris);border:1px solid var(--borde);margin-top:6px}
  .chico{width:auto;padding:6px 10px;margin:0;font-size:13px}
</style>
</head>
<body>
<header>{% block header %}<h1>Reporte Móvil</h1>{% endblock %}</header>
<main>
{% for m in get_flashed_messages() %}<div class="aviso ok">{{ m }}</div>{% endfor %}
{% block contenido %}{% endblock %}
</main>
</body>
</html>
